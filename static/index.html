<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiteLLM Chat Interface</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-top">
            <button class="sidebar-btn new-chat" id="newChat" aria-label="New chat">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" />
                    <line x1="12" y1="8" x2="12" y2="16" />
                    <line x1="8" y1="12" x2="16" y2="12" />
                </svg>
            </button>
        </div>
        <div class="sidebar-bottom">
            <button class="sidebar-btn" id="settingsBtn" aria-label="Settings">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3" />
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
            </button>
            <button class="sidebar-btn user-btn" id="userBtn" aria-label="User profile">
                <span class="user-avatar">S</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="chat-container" id="chatContainer">
            <!-- Welcome Screen -->
            <div class="welcome-screen" id="welcomeScreen">
                <h1 class="greeting-text">LiteLLM Gateway</h1>

                <div class="input-container">
                    <div class="input-wrapper">
                        <input type="text" id="messageInput" class="message-input"
                            placeholder="How can I help you today?" autocomplete="off" />

                        <div class="input-right">
                            <select id="modelSelect" class="model-select">
                                <option value="gpt-5.2">GPT-5.2</option>
                                <option value="claude-opus-4-5">Claude Opus 4.5</option>
                                <option value="gpt-5.1-codex-max">GPT-5.1 Codex Max</option>
                            </select>
                            <button class="send-btn" id="sendBtn" aria-label="Send message">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <line x1="12" y1="19" x2="12" y2="5" />
                                    <polyline points="5 12 12 5 19 12" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Chat Messages -->
            <div class="messages-container" id="messagesContainer" style="display: none;">
                <div class="messages" id="messages"></div>

                <div class="input-container fixed">
                    <div class="input-wrapper">
                        <input type="text" id="messageInput2" class="message-input" placeholder="Type your message..."
                            autocomplete="off" />

                        <div class="input-right">
                            <select id="modelSelect2" class="model-select">
                                <option value="gpt-5.2">GPT-5.2</option>
                                <option value="claude-opus-4-5">Claude Opus 4.5</option>
                                <option value="gpt-5.1-codex-max">GPT-5.1 Codex Max</option>
                            </select>
                            <button class="send-btn" id="sendBtn2" aria-label="Send message">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <line x1="12" y1="19" x2="12" y2="5" />
                                    <polyline points="5 12 12 5 19 12" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settingsModal" class="modal" style="display: none;">
            <div class="modal-content">
                <h3>Settings</h3>
                <div class="setting-item">
                    <label for="apiKeyInput">Gateway API Key</label>
                    <input type="password" id="apiKeyInput" placeholder="sk-..." />
                </div>
                <button id="saveSettings" class="primary-btn">Save</button>
            </div>
        </div>
    </main>

    <script src="/static/app.js"></script>
</body>

</html>
